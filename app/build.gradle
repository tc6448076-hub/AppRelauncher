plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.apprelauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.apprelauncher"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
